<!DOCTYPE html>
<html lang="en">
<head>
    <title>Gemini RAG Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #111118;
            --surface2: #18181f;
            --border: rgba(255,255,255,0.07);
            --accent: #7c6dfa;
            --accent2: #fa6d9e;
            --accent-glow: rgba(124, 109, 250, 0.25);
            --text: #e8e8f0;
            --text-muted: #6b6b80;
            --user-bg: rgba(124, 109, 250, 0.12);
            --bot-bg: rgba(250, 109, 158, 0.08);
            --success: #4ade80;
            --radius: 16px;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Mono', monospace;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow-x: hidden;
        }

        /* Atmospheric background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 50% at 20% 10%, rgba(124,109,250,0.08) 0%, transparent 60%),
                radial-gradient(ellipse 60% 40% at 80% 90%, rgba(250,109,158,0.06) 0%, transparent 55%);
            pointer-events: none;
            z-index: 0;
        }

        .chat-box {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 720px;
            display: flex;
            flex-direction: column;
            gap: 0;
            animation: fadeUp 0.6s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── Header ── */
        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 28px 32px 22px;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
            border-radius: var(--radius) var(--radius) 0 0;
            text-align: center;
            position: relative;
        }

        .header-icon {
            width: 40px;
            height: 40px;
            border-radius: 11px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 0 20px var(--accent-glow);
            margin-bottom: 4px;
        }

        .header-text h2 {
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 18px;
            letter-spacing: -0.2px;
            color: var(--text);
            line-height: 1;
        }

        .header-text p {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 3px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .status-dot {
            position: absolute;
            top: 20px;
            right: 24px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 0.04em;
        }

        .status-dot::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 6px var(--success);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.4; }
        }

        /* ── Upload Section ── */
        .upload-section {
            background: var(--surface);
            padding: 20px 32px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .file-label {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--surface2);
            border: 1px dashed var(--border);
            border-radius: 10px;
            padding: 10px 16px;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            overflow: hidden;
        }

        .file-label:hover {
            border-color: var(--accent);
            background: rgba(124,109,250,0.05);
        }

        .file-label svg {
            flex-shrink: 0;
            opacity: 0.5;
        }

        #fileInput {
            display: none;
        }

        #fileName {
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: color 0.2s;
        }

        #fileName.active { color: var(--accent); }

        .upload-btn {
            flex-shrink: 0;
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent), #9b8dfa);
            color: #fff;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
            white-space: nowrap;
            letter-spacing: 0.02em;
        }

        .upload-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 8px 20px var(--accent-glow);
        }

        .upload-btn:active { transform: translateY(0); }

        /* ── Toast ── */
        .toast {
            position: fixed;
            top: 24px;
            right: 24px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-left: 3px solid var(--success);
            color: var(--text);
            font-size: 13px;
            padding: 12px 18px;
            border-radius: 10px;
            transform: translateX(120%);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 100;
            max-width: 280px;
        }

        .toast.show { transform: translateX(0); }

        /* ── Messages ── */
        .messages {
            background: var(--surface);
            padding: 24px 32px;
            min-height: 340px;
            max-height: 420px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scrollbar-width: thin;
            scrollbar-color: var(--surface2) transparent;
        }

        .messages::-webkit-scrollbar { width: 4px; }
        .messages::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 4px; }

        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: var(--text-muted);
            font-size: 13px;
            text-align: center;
            opacity: 0.6;
            padding: 40px 0;
        }

        .empty-state svg { opacity: 0.3; }

        .msg {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            animation: msgIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }

        @keyframes msgIn {
            from { opacity: 0; transform: translateY(10px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .msg-avatar {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .msg.user { flex-direction: row-reverse; }
        .msg.user .msg-avatar { background: rgba(124,109,250,0.2); }
        .msg.bot .msg-avatar { background: rgba(250,109,158,0.15); }

        .msg-bubble {
            max-width: 82%;
            padding: 11px 16px;
            border-radius: 14px;
            font-size: 13.5px;
            line-height: 1.65;
            letter-spacing: 0.01em;
        }

        .msg.user .msg-bubble {
            background: var(--user-bg);
            border: 1px solid rgba(124,109,250,0.2);
            border-top-right-radius: 4px;
            color: #c8c4ff;
        }

        .msg.bot .msg-bubble {
            background: var(--bot-bg);
            border: 1px solid rgba(250,109,158,0.15);
            border-top-left-radius: 4px;
            color: var(--text);
        }

        /* Typing indicator */
        .typing .msg-bubble {
            display: flex;
            gap: 5px;
            align-items: center;
            padding: 14px 18px;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent2);
            animation: typingBounce 1.2s ease-in-out infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.15s; }
        .typing-dot:nth-child(3) { animation-delay: 0.30s; }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30%            { transform: translateY(-5px); opacity: 1; }
        }

        /* ── Input Section ── */
        .input-section {
            background: var(--surface);
            padding: 20px 32px 24px;
            border-top: 1px solid var(--border);
            border-radius: 0 0 var(--radius) var(--radius);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .textarea-wrap {
            flex: 1;
            position: relative;
        }

        #query {
            width: 100%;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 13px 16px;
            color: var(--text);
            font-family: 'DM Mono', monospace;
            font-size: 13px;
            line-height: 1.5;
            resize: none;
            min-height: 50px;
            max-height: 140px;
            overflow-y: auto;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        #query::placeholder { color: var(--text-muted); }

        #query:focus {
            border-color: rgba(124,109,250,0.4);
            box-shadow: 0 0 0 3px rgba(124,109,250,0.08);
        }

        .ask-btn {
            flex-shrink: 0;
            width: 48px;
            height: 48px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 4px 14px var(--accent-glow);
        }

        .ask-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 8px 22px var(--accent-glow);
        }

        .ask-btn:active { transform: translateY(0); }

        .input-hint {
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 0.03em;
        }
    </style>
</head>
<body>

<!-- Toast notification -->
<div class="toast" id="toast">✓ PDF uploaded successfully</div>

<div class="chat-box">

    <!-- Header -->
    <div class="header">
        <div class="header-icon">📄</div>
        <div class="header-text">
            <h2>Gemini RAG Chat</h2>
            <p>Retrieval-Augmented Generation</p>
        </div>
        <div class="status-dot">ONLINE</div>
    </div>

    <!-- Upload Section -->
    <div class="upload-section">
        <label class="file-label" for="fileInput">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                <polyline points="17 8 12 3 7 8"/>
                <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            <span id="fileName">Choose a PDF file…</span>
        </label>
        <input type="file" id="fileInput" accept=".pdf" onchange="handleFileSelect(this)" />
        <button class="upload-btn" onclick="uploadPDF()">Upload PDF</button>
    </div>

    <!-- Messages -->
    <div class="messages" id="messages">
        <div class="empty-state" id="emptyState">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
            </svg>
            <div>Upload a PDF and start asking questions</div>
        </div>
    </div>

    <!-- Input Section -->
    <div class="input-section">
        <div class="input-row">
            <div class="textarea-wrap">
                <textarea
                    id="query"
                    placeholder="Ask a question about your document…"
                    rows="1"
                    onkeydown="handleKey(event)"
                    oninput="autoResize(this)"
                ></textarea>
            </div>
            <button class="ask-btn" onclick="askQuestion()" title="Send">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"/>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                </svg>
            </button>
        </div>
        <div class="input-hint">↵ Enter to send &nbsp;·&nbsp; Shift+Enter for new line</div>
    </div>
</div>

<script>
    /* ── File picker label update ── */
    function handleFileSelect(input) {
        const label = document.getElementById('fileName');
        if (input.files && input.files[0]) {
            label.textContent = input.files[0].name;
            label.classList.add('active');
        } else {
            label.textContent = 'Choose a PDF file…';
            label.classList.remove('active');
        }
    }

    /* ── Toast helper ── */
    function showToast(message, isError = false) {
        const toast = document.getElementById('toast');
        toast.textContent = (isError ? '✗ ' : '✓ ') + message;
        toast.style.borderLeftColor = isError ? '#f87171' : 'var(--success)';
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }

    /* ── Upload PDF ── */
    async function uploadPDF() {
        const file = document.getElementById("fileInput").files[0];
        if (!file) { showToast("Please select a file first", true); return; }

        const formData = new FormData();
        formData.append("file", file);

        try {
            const res = await fetch("/upload", {
                method: "POST",
                body: formData
            });

            const data = await res.json();
            showToast("Uploaded: " + data.file);
        } catch (err) {
            showToast("Upload failed", true);
        }
    }

    /* ── Message helpers ── */
    function hideEmptyState() {
        const empty = document.getElementById('emptyState');
        if (empty) empty.remove();
    }

    function addMessage(text, type) {
        hideEmptyState();
        const container = document.getElementById("messages");

        const msg = document.createElement("div");
        msg.className = "msg " + type;

        const avatar = document.createElement("div");
        avatar.className = "msg-avatar";
        avatar.textContent = type === 'user' ? '👤' : '🤖';

        const bubble = document.createElement("div");
        bubble.className = "msg-bubble";
        bubble.textContent = text;

        msg.appendChild(avatar);
        msg.appendChild(bubble);
        container.appendChild(msg);
        container.scrollTop = container.scrollHeight;

        return msg;
    }

    function addTypingIndicator() {
        hideEmptyState();
        const container = document.getElementById("messages");

        const msg = document.createElement("div");
        msg.className = "msg bot typing";
        msg.id = "typingIndicator";

        const avatar = document.createElement("div");
        avatar.className = "msg-avatar";
        avatar.textContent = '🤖';

        const bubble = document.createElement("div");
        bubble.className = "msg-bubble";
        bubble.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';

        msg.appendChild(avatar);
        msg.appendChild(bubble);
        container.appendChild(msg);
        container.scrollTop = container.scrollHeight;
    }

    function removeTypingIndicator() {
        const el = document.getElementById("typingIndicator");
        if (el) el.remove();
    }

    /* ── Send question ── */
    async function askQuestion() {
        const queryEl = document.getElementById("query");
        const query = queryEl.value.trim();
        if (!query) return;

        addMessage(query, "user");
        queryEl.value = "";
        autoResize(queryEl);
        addTypingIndicator();

        try {
            const res = await fetch("/ask", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ query: query, top_k: 3 })
            });

            const data = await res.json();
            removeTypingIndicator();
            addMessage(data.answer, "bot");
        } catch (err) {
            removeTypingIndicator();
            addMessage("Sorry, something went wrong. Please try again.", "bot");
        }
    }

    /* ── Keyboard shortcut ── */
    function handleKey(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            askQuestion();
        }
    }

    /* ── Auto-resize textarea ── */
    function autoResize(el) {
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 140) + 'px';
    }
</script>

</body>
</html>
