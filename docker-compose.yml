services:
  app:
    build: .
    container_name: gemini-rag-app

    env_file:
      - .env
    volumes:
      - ./chroma_db:/app/chroma_db  # persist vector db
    restart: unless-stopped
  
  nginx:
    image: nginx:latest
    container_name: gemini-rag-nginx

    ports:
      - "80:80"
      - "443:443"
    
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./ssl:/etc/nginx/ssl
    
    depends_on:
      - app
    
    restart: unless-stopped